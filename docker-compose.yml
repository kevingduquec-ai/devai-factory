services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: devai
      POSTGRES_PASSWORD: devai
      POSTGRES_DB: devai_factory
    ports:
      - "5433:5432"
    volumes:
      - devai_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devai"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  devai_postgres_data:
